<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>Warface?</title>
    <style>
        body {
            margin: 0;
            height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            background: linear-gradient(135deg, #1e1e1e, #3a3a3a);
            font-family: Arial, sans-serif;
            overflow: hidden;
            color: white;
        }

        .container {
            text-align: center;
            background: rgba(0,0,0,0.7);
            padding: 40px;
            border-radius: 20px;
            box-shadow: 0 0 40px rgba(0,0,0,0.6);
        }

        h1 {
            margin-bottom: 20px;
        }

        button {
            padding: 15px 35px;
            font-size: 20px;
            border: none;
            border-radius: 12px;
            cursor: pointer;
        }

        #yesBtn {
            background: #00c853;
            color: black;
        }

        #yesBtn:hover {
            background: #00e676;
        }

        #noBtn {
            position: absolute;
            background: #ff5252;
            color: white;
        }

        img {
            max-width: 300px;
            border-radius: 20px;
            margin-top: 20px;
            box-shadow: 0 0 20px rgba(0,0,0,0.7);
        }
    </style>
</head>
<body>

<div class="container" id="box">
    <h1>Еблан, пошли в Warface? 🎮</h1>
    <button id="yesBtn">Да 😎</button>
    <button id="noBtn">Нет ❌</button>
</div>

<script>
    const noBtn = document.getElementById("noBtn");
    const yesBtn = document.getElementById("yesBtn");
    const box = document.getElementById("box");

    noBtn.addEventListener("mouseover", () => {
        const x = Math.random() * (window.innerWidth - noBtn.offsetWidth);
        const y = Math.random() * (window.innerHeight - noBtn.offsetHeight);
        noBtn.style.left = x + "px";
        noBtn.style.top = y + "px";
    });

    yesBtn.addEventListener("click", () => {
        box.innerHTML = `
            <h1>Правильный выбор 😎🐶</h1>
            <p>Вот тебе хороший пёс за согласие</p>
            <img src="https://upload.wikimedia.org/wikipedia/commons/6/6e/Golde33443.jpg" alt="Good dog">
        `;
    });
</script>

</body>
</html>
