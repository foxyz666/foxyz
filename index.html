<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>С ДР 🎉</title>
    <style>
        body {
            margin: 0;
            height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            background: linear-gradient(135deg, #ffcc70, #ff8177);
            font-family: Arial, sans-serif;
            overflow: hidden;
        }

        .box {
            text-align: center;
            background: white;
            padding: 40px;
            border-radius: 20px;
            box-shadow: 0 20px 40px rgba(0,0,0,0.3);
        }

        h1 {
            margin-bottom: 20px;
        }

        p {
            margin-bottom: 25px;
            font-size: 18px;
        }

        button {
            padding: 15px 35px;
            font-size: 20px;
            border: none;
            border-radius: 12px;
            cursor: pointer;
        }

        #yes {
            position: absolute;
            background: #4caf50;
            color: white;
        }

        #no {
            background: #f44336;
            color: white;
        }

        img {
            max-width: 350px;
            margin-top: 20px;
            border-radius: 15px;
        }
    </style>
</head>
<body>

<div class="box" id="box">
    <h1>🎉 Ооо, поздравляю с днём рождения!</h1>
    <p>Хочешь получить подарок? 🎁</p>
    <button id="no">Нет ❌</button>
    <button id="yes">Да 😎</button>
</div>

<script>
    const yes = document.getElementById("yes");
    const no = document.getElementById("no");
    const box = document.getElementById("box");

    let scale = 1;

    // начальная позиция кнопки "Да"
    moveYes();

    function moveYes() {
        const x = Math.random() * (window.innerWidth - yes.offsetWidth);
        const y = Math.random() * (window.innerHeight - yes.offsetHeight);
        yes.style.left = x + "px";
        yes.style.top = y + "px";
    }

    // при наведении на "Да"
    yes.addEventListener("mouseenter", () => {
        scale -= 0.07;
        if (scale < 0.3) scale = 0.3;
        yes.style.transform = `scale(${scale})`;
        moveYes();
    });

    // при клике на "Нет"
    no.addEventListener("click", () => {
        box.innerHTML = `
            <h1>🎉 С др броооооо! 😂😂</h1>
            <img src="https://media1.tenor.com/m/uATVCkQ_9BEAAAAd/%D0%BF%D0%B0%D0%BF%D0%B8%D1%87-%D0%B0%D1%80%D1%82%D0%B0%D1%81.gif" alt="Papich">
        `;
    });
</script>

</body>
</html>
