<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>С ДР 🎉</title>
    <style>
        body {
            margin: 0;
            height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            background: linear-gradient(135deg, #ffcc70, #ff8177);
            font-family: Arial, sans-serif;
            overflow: hidden;
        }

        .box {
            text-align: center;
            background: white;
            padding: 40px;
            border-radius: 20px;
            box-shadow: 0 20px 40px rgba(0,0,0,0.3);
            position: relative;
        }

        h1 {
            margin-bottom: 20px;
        }

        p {
            margin-bottom: 25px;
            font-size: 18px;
        }

        .buttons {
            display: flex;
            justify-content: center;
        }

        button {
            padding: 15px 35px;
            font-size: 20px;
            border: none;
            border-radius: 12px;
            cursor: pointer;
        }

        #no {
            background: #f44336;
            color: white;
            z-index: 1;
        }

        #yes {
            background: #4caf50;
            color: white;
            position: absolute;
            left: calc(50% + 90px); /* рядом с Нет */
            top: 50%;
            transform: translateY(-50%);
        }

        video {
            max-width: 500px;
            margin-top: 20px;
            border-radius: 15px;
            pointer-events: none; /* ❌ нельзя кликнуть */
        }
    </style>
</head>
<body>

<div class="box" id="box">
    <h1>🎉 Ооо, поздравляю с днём рождения!</h1>
    <p>Хочешь получить подарок? 🎁</p>

    <div class="buttons">
        <button id="no">Нет ❌</button>
    </div>

    <button id="yes">Да 😎</button>
</div>

<script>
    const yes = document.getElementById("yes");
    const no = document.getElementById("no");
    const box = document.getElementById("box");

    let scale = 1;

    function teleportYes() {
        const x = Math.random() * (window.innerWidth - yes.offsetWidth);
        const y = Math.random() * (window.innerHeight - yes.offsetHeight);
        yes.style.left = x + "px";
        yes.style.top = y + "px";
    }

    // при наведении — ТП и уменьшение
    yes.addEventListener("mouseenter", () => {
        scale -= 0.08;
        if (scale < 0.3) scale = 0.3;
        yes.style.transform = `scale(${scale})`;
        teleportYes();
    });

    // при клике на "Нет"
    no.addEventListener("click", () => {
        box.innerHTML = `
            <h1>🎉 С др броооооо! 🔥😎</h1>
            <video src="papich.mp4"
                   autoplay
                   loop
                   muted
                   playsinline>
            </video>
        `;
    });
</script>

</body>
</html>
