<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>С Днём Рождения 🎉</title>
    <style>
        body {
            margin: 0;
            height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            background: linear-gradient(135deg, #ffcc70, #ff8177);
            font-family: Arial, sans-serif;
            overflow: hidden;
        }

        .container {
            text-align: center;
            background: rgba(255,255,255,0.95);
            padding: 40px;
            border-radius: 20px;
            box-shadow: 0 20px 40px rgba(0,0,0,0.3);
        }

        h1 {
            margin-bottom: 25px;
        }

        button {
            padding: 15px 35px;
            font-size: 20px;
            border: none;
            border-radius: 12px;
            cursor: pointer;
            transition: transform 0.2s, font-size 0.2s;
        }

        #yesBtn {
            background: #4caf50;
            color: white;
            margin-right: 20px;
        }

        #noBtn {
            position: absolute;
            background: #f44336;
            color: white;
        }

        img {
            max-width: 320px;
            border-radius: 15px;
            margin-top: 20px;
        }
    </style>
</head>
<body>

<div class="container" id="box">
    <h1>🎉 Ооо, поздравляю с днём рождения!</h1>
    <p>Хочешь получить подарок? 🎁</p>
    <button id="yesBtn">Да 😎</button>
    <button id="noBtn">Нет ❌</button>
</div>

<script>
    const yesBtn = document.getElementById("yesBtn");
    const noBtn = document.getElementById("noBtn");
    const box = document.getElementById("box");

    let yesScale = 1;
    let noScale = 1;

    yesBtn.addEventListener("click", () => {
        // увеличиваем "Да"
        yesScale += 0.1;
        yesBtn.style.transform = `scale(${yesScale})`;

        // уменьшаем "Нет"
        noScale -= 0.1;
        if (noScale < 0.4) noScale = 0.4;
        noBtn.style.transform = `scale(${noScale})`;

        // переносим "Нет" в случайный угол
        const x = Math.random() * (window.innerWidth - noBtn.offsetWidth);
        const y = Math.random() * (window.innerHeight - noBtn.offsetHeight);
        noBtn.style.left = x + "px";
        noBtn.style.top = y + "px";
    });

    noBtn.addEventListener("click", () => {
        box.innerHTML = `
            <h1>Ну и ладно 😈</h1>
            <p>Подарок отменяется</p>
            <img src="https://media.tenor.com/vmE2JpXjJkUAAAAC/%D0%BF%D0%B0%D0%BF%D0%B8%D1%87-%D0%B0%D1%80%D1%82%D0%B0%D1%81.gif" alt="Papich laugh">
        `;
    });
</script>

</body>
</html>
